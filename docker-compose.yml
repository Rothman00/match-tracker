version: '3.8'
services:
  database:
    image: postgres:15-alpine
    container_name: match-tracker-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: match_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 062603102

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile

    container_name: match-tracker-backend
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html

    ports:
      - "8000:80"

    depends_on:
      - database


  frontend:
    image: node:22-alpine
    container_name: match-tracker-frontend
    restart: unless-stopped

    working_dir: /app

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    command: npm run dev -- --host 0.0.0.0

    depends_on:
      - backend


volumes:
  postgres_data:
